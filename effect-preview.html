<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>演出プレビュー（開発用）</title>
  </head>
  <body>
    <!--
      演出だけを音源抜きで見比べるための開発用ページ。`npm run dev` で
      /lyric-stage/effect-preview.html を開き、コンソールから play('文字', 'bounce') と叩く。
      （vite.config.ts の base が /lyric-stage/ なので、dev サーバーでもこの前置きが要る）

      Vite のビルド入口は index.html だけなので、このページは dist に入らない
      （＝公開サイトには出ない）。曲の再生位置に縛られず新しい演出を確かめられるので、
      M4 以降で演出を足すときはここで見る。

      注意:
      - tsconfig の include は src だけなので、このページの中身は型検査もテストも通らない。
        LyricStage のシグネチャを変えたら、ここも手で直す必要がある
      - vite.config.ts で複数ページ構成（rollupOptions.input）にすると公開対象に入る。
        その時はこのページを除外すること
    -->
    <!-- 背景（M8-2 / Issue #41）。**歌詞と一緒に見えないと密度を判断できない**ので、
         このページにも出す。本編と違って音が無いので、強さは window.loud で手で動かす -->
    <!-- 画を裏返す枠（M9-3a / Issue #57）。本編と同じく中身をすべて包む。
         このページには歌詞シートが無いので、極性はコンソールから手で切り替える
         （下の window.polarity を見よ） -->
    <div class="scene" id="scene">
      <!-- **本編と同じく 2 枚**（M11 のレビュー指摘 🟡）。ここは「演出の見えを判断する
           道具」なので、地が本編と違うと違う画を見て決めることになる -->
      <canvas class="backdrop backdrop--graph" id="backdrop-graph" aria-hidden="true"></canvas>
      <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
      <main class="stage">
        <!-- 語句の枠はここに LyricStage が立てる。中身は触らない -->
        <div class="stage__lines" id="stage-lines"></div>
      </main>
    </div>
    <script type="module">
      import gsap from 'gsap';
      import { SplitText } from 'gsap/SplitText';
      import { createBeatPulse, createFlashPulse } from './src/domain/beat.ts';
      import { POLARITIES } from './src/domain/lyrics.ts';
      import { neverReduceMotion } from './src/lib/reduced-motion.ts';
      import { mountBeatImpact } from './src/stage/beat-impact.ts';
      import { ANCHOR_CLASS, SIZE_CLASS } from './src/stage/composition.ts';
      import { loadDeclaredFonts } from './src/stage/display-font.ts';
      import { decors } from './src/stage/decor.ts';
      import { effects } from './src/stage/effects.ts';
      import { GrainField } from './src/stage/grain-field.ts';
      import { GraphField } from './src/stage/graph-field.ts';
      import { LyricStage } from './src/stage/lyric-stage.ts';
      import { ScaledCanvas, systemPixelRatio } from './src/stage/scaled-canvas.ts';
      import { mountScreenDecor } from './src/stage/screen-decor.ts';
      import { sparks } from './src/stage/spark.ts';
      import { BEAT_GRID } from './src/work.ts';
      import './src/style.css';

      gsap.registerPlugin(SplitText);

      // 画面に敷く図形（M8-3b / Issue #45）。背景（#41）と同じ理由でこのページにも出す
      // — 分割線と四隅の中に語句が置かれた画を見ないと、構図も図形の濃さも決められない
      const scene = document.getElementById('scene');
      const screenDecor = mountScreenDecor(scene);

      // ビート同期の衝撃（M8-4 / Issue #49）。背景・図形と同じ理由でこのページにも出す
      // — 画が拍で叩かれている中に語句が置かれないと、演出の動きが足りているか判断できない。
      //
      // **格子の起点は 0。** 本編の時計は音の再生位置だが、このページの時計は
      // ページを開いてからの経過時間なので、曲の先頭起点の秒数（BEAT_GRID.origin）を
      // そのまま使うと拍の位相が曲と無関係にずれる（速さだけを借りる）。
      // 強さは背景と同じ window.loud（音が無いので手で動かす）
      const lines = document.getElementById('stage-lines');
      const beatGrid = { bpm: BEAT_GRID.bpm, origin: 0 };
      const beatImpact = mountBeatImpact(
        { layer: screenDecor, lines },
        {
          flash: createFlashPulse(beatGrid, { division: 1, decay: 0.5 }),
          shake: createBeatPulse(beatGrid, { division: 2, decay: 0.45 }),
        },
        neverReduceMotion,
        () => window.loud,
      );

      // 本編（src/main.ts）と同じく、書体が届いてから測る（M8-2a）。
      // SplitText は 1 文字ずつの位置を測ってから動かすので、代替の書体のまま測ると
      // ここで見た演出が本番とわずかにずれる。**このページは目で確かめる道具**なので、
      // 見えているものが本番と違うのは本末転倒
      await loadDeclaredFonts(document.fonts);

      // ここは演出そのものを見る道具なので、OS の「視差効果を減らす」設定に関わらず
      // 素の演出を出す。本編（src/main.ts）は systemReducedMotion() を渡す
      const stage = new LyricStage(lines, neverReduceMotion);

      /**
       * 行を出して、時計を回す。
       *
       * LyricStage は自分では進まない（M8-5）。本編では音の再生位置が時計になるが、
       * このページには音が無いので、代わりにここが経過時間を渡す。
       * 止めたい時は window.hold = true、コマ送りは stage.render(秒) で。
       */
      // 時計は 1 本だけ。呼ぶたびにループを増やすと、古いループが新しい行に
      // 別の時刻を書き込み続けて再生位置が飛ぶ
      let frame = null;
      // 行が画面に出ている長さ（M13-1）。本編では次の行までの間隔が決めるが、
      // このページには次の行が無いので、本編の行間隔（約 3 秒）を既定として渡す。
      // **無限にはしない** — 漂い（M13-2）は有限の滞在に対して組むので、
      // 無限を渡すと漂いだけが黙って出なくなる。window.lineSpan で変えられる
      window.lineSpan = 3;
      const start = (line) => {
        if (frame !== null) cancelAnimationFrame(frame);
        stage.show(line, window.lineSpan);

        let last = performance.now();
        let elapsed = 0;
        const step = (now) => {
          // hold 中は経過を足さない（基準時刻を止めないと、解除した瞬間に跳ねる）
          if (!window.hold) elapsed += (now - last) / 1000;
          last = now;
          stage.render(elapsed);
          frame = requestAnimationFrame(step);
        };
        frame = requestAnimationFrame(step);
      };

      /**
       * 1 行を指定の演出と構図で表示する。どちらも省くと既定になる。
       * 例: play('世界が広がる', 'zoom', { at: 'bottom-right', size: 'xl', tilt: -5 })
       */
      window.play = (text, effect, place) => start({ time: 0, text, effect, place });

      /**
       * 語句に刻んだ行を試す（M8-5）。本編シートの parts と同じ形を渡す。
       * **ここは parseLyricSheet を通らない**ので、本番なら弾かれる形（at の逆順など）も
       * そのまま動く。形の検証を見たい時は src/domain/lyrics.test.ts の方を見ること。
       * 例: playParts([
       *       { text: 'シャイニング', at: 0, effect: 'rushIn', place: { at: 'middle-left', size: 'lg' } },
       *       { text: 'スター', at: 0.95, effect: 'zoom', place: { at: 'top-right', size: 'xl' } },
       *     ])
       */
      window.playParts = (parts) =>
        start({ time: 0, text: parts.map((part) => part.text).join(''), parts });

      // 背景は歌詞とは別の時計で回す（M8-2）。本編では音の再生位置が時計だが、
      // このページには音が無い。行を出す前から背景だけを眺められる方が、
      // 「文字が乗っていない状態でどれだけ引けているか」を見るのに都合がよい。
      //
      // 音の代わりに window.loud（0〜1）で盛り上がりを手で動かす。
      // 1 にするとビネットが退き、粒が濃くなり、グラフの塊がふくらむ
      window.loud = 0;
      const backdrops = [
        new GraphField(
          new ScaledCanvas(document.getElementById('backdrop-graph'), systemPixelRatio),
          neverReduceMotion,
          () => window.loud,
        ),
        new GrainField(
          new ScaledCanvas(document.getElementById('backdrop'), systemPixelRatio),
          neverReduceMotion,
          () => window.loud,
        ),
      ];
      const spin = (now) => {
        for (const backdrop of backdrops) backdrop.render(now / 1000);
        // 拍の衝撃も背景と同じ時計で回す（歌詞の時計とは別。行を出す前から画が拍で動く）
        beatImpact.render(now / 1000);
        requestAnimationFrame(spin);
      };
      requestAnimationFrame(spin);

      // コマ送りで見たいときは window.hold = true で時計を止め、stage.render(秒) で
      // 任意のコマに飛ぶ。gsap 本体も出しておく（globalTimeline の様子を見る用）
      window.stage = stage;
      window.gsap = gsap;

      // 極性（M9-3a / Issue #57）。本編はシートの polarity が決めるが、このページには
      // シートが無いので手で切り替える。**構図も図形も両極で見比べる必要がある** —
      // 反転はコントラスト比を保つ（実測は src/style.css）が、線の細さや粒の密度が
      // どう見えるかは画を見ないと分からない。
      // 明滅の下限（domain の MIN_POLARITY_INTERVAL）はシートの入口で掛かるものなので、
      // 手で叩くこの口には掛からない。連打しないこと
      window.polarity = (value = scene.dataset.polarity === 'ink' ? 'paper' : 'ink') => {
        // 名前を確かめる（レビュー指摘 🟡）。綴りを間違えると未知の属性値が入り、
        // **画は paper のまま黙って効かない**（本編は parseLyricSheet が落とす）
        if (!POLARITIES.includes(value)) {
          throw new RangeError(`極性は ${POLARITIES.join(' / ')} のどれかです: ${value}`);
        }
        scene.dataset.polarity = value;
        return value;
      };

      console.info(
        [
          `play('文字', '演出名', 構図) / playParts([{ text, at, effect, place, decor, sub, spark }, ...]) で試せます。`,
          `演出名: ${Object.keys(effects).join(' / ')}`,
          `at: ${Object.keys(ANCHOR_CLASS).join(' / ')}`,
          `size: ${Object.keys(SIZE_CLASS).join(' / ')}`,
          `decor（語句に貼り付く図形。playParts でのみ指定）: ${Object.keys(decors).join(' / ')}`,
          `sub（語句に添える英字。playParts でのみ指定。例 sub: 'LIKE MAGIC'）`,
          `spark（語句に一瞬だけ添える装飾。playParts でのみ指定。1 語句に 1 つ）: ${Object.keys(sparks).join(' / ')}`,
          `背景の盛り上がりと拍の衝撃は window.loud = 0〜1 で動かせます。`,
          `画の明暗は polarity() で裏返せます（polarity('ink') / polarity('paper')）。`,
        ].join('\n'),
      );
    </script>
  </body>
</html>
