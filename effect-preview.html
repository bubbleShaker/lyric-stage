<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>演出プレビュー（開発用）</title>
  </head>
  <body>
    <!--
      演出だけを音源抜きで見比べるための開発用ページ。`npm run dev` で
      /lyric-stage/effect-preview.html を開き、コンソールから play('文字', 'bounce') と叩く。
      （vite.config.ts の base が /lyric-stage/ なので、dev サーバーでもこの前置きが要る）

      Vite のビルド入口は index.html だけなので、このページは dist に入らない
      （＝公開サイトには出ない）。曲の再生位置に縛られず新しい演出を確かめられるので、
      M4 以降で演出を足すときはここで見る。

      注意:
      - tsconfig の include は src だけなので、このページの中身は型検査もテストも通らない。
        LyricStage のシグネチャを変えたら、ここも手で直す必要がある
      - vite.config.ts で複数ページ構成（rollupOptions.input）にすると公開対象に入る。
        その時はこのページを除外すること
    -->
    <!-- 背景（M8-2 / Issue #41）。**歌詞と一緒に見えないと密度を判断できない**ので、
         このページにも出す。本編と違って音が無いので、強さは window.loud で手で動かす -->
    <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>
    <main class="stage">
      <!-- 語句の枠はここに LyricStage が立てる。中身は触らない -->
      <div class="stage__lines" id="stage-lines"></div>
    </main>
    <script type="module">
      import gsap from 'gsap';
      import { SplitText } from 'gsap/SplitText';
      import { neverReduceMotion } from './src/lib/reduced-motion.ts';
      import { ANCHOR_CLASS, SIZE_CLASS } from './src/stage/composition.ts';
      import { loadDeclaredFonts } from './src/stage/display-font.ts';
      import { decors } from './src/stage/decor.ts';
      import { effects } from './src/stage/effects.ts';
      import { GrainField } from './src/stage/grain-field.ts';
      import { LyricStage } from './src/stage/lyric-stage.ts';
      import { ScaledCanvas, systemPixelRatio } from './src/stage/scaled-canvas.ts';
      import { mountScreenDecor } from './src/stage/screen-decor.ts';
      import './src/style.css';

      gsap.registerPlugin(SplitText);

      // 画面に敷く図形（M8-3b / Issue #45）。背景（#41）と同じ理由でこのページにも出す
      // — 分割線と四隅の中に語句が置かれた画を見ないと、構図も図形の濃さも決められない
      mountScreenDecor(document.body);

      // 本編（src/main.ts）と同じく、書体が届いてから測る（M8-2a）。
      // SplitText は 1 文字ずつの位置を測ってから動かすので、代替の書体のまま測ると
      // ここで見た演出が本番とわずかにずれる。**このページは目で確かめる道具**なので、
      // 見えているものが本番と違うのは本末転倒
      await loadDeclaredFonts(document.fonts);

      // ここは演出そのものを見る道具なので、OS の「視差効果を減らす」設定に関わらず
      // 素の演出を出す。本編（src/main.ts）は systemReducedMotion() を渡す
      const stage = new LyricStage(document.getElementById('stage-lines'), neverReduceMotion);

      /**
       * 行を出して、時計を回す。
       *
       * LyricStage は自分では進まない（M8-5）。本編では音の再生位置が時計になるが、
       * このページには音が無いので、代わりにここが経過時間を渡す。
       * 止めたい時は window.hold = true、コマ送りは stage.render(秒) で。
       */
      // 時計は 1 本だけ。呼ぶたびにループを増やすと、古いループが新しい行に
      // 別の時刻を書き込み続けて再生位置が飛ぶ
      let frame = null;
      const start = (line) => {
        if (frame !== null) cancelAnimationFrame(frame);
        stage.show(line);

        let last = performance.now();
        let elapsed = 0;
        const step = (now) => {
          // hold 中は経過を足さない（基準時刻を止めないと、解除した瞬間に跳ねる）
          if (!window.hold) elapsed += (now - last) / 1000;
          last = now;
          stage.render(elapsed);
          frame = requestAnimationFrame(step);
        };
        frame = requestAnimationFrame(step);
      };

      /**
       * 1 行を指定の演出と構図で表示する。どちらも省くと既定になる。
       * 例: play('世界が広がる', 'zoom', { at: 'bottom-right', size: 'xl', tilt: -5 })
       */
      window.play = (text, effect, place) => start({ time: 0, text, effect, place });

      /**
       * 語句に刻んだ行を試す（M8-5）。本編シートの parts と同じ形を渡す。
       * **ここは parseLyricSheet を通らない**ので、本番なら弾かれる形（at の逆順など）も
       * そのまま動く。形の検証を見たい時は src/domain/lyrics.test.ts の方を見ること。
       * 例: playParts([
       *       { text: 'シャイニング', at: 0, effect: 'rushIn', place: { at: 'middle-left', size: 'lg' } },
       *       { text: 'スター', at: 0.95, effect: 'zoom', place: { at: 'top-right', size: 'xl' } },
       *     ])
       */
      window.playParts = (parts) =>
        start({ time: 0, text: parts.map((part) => part.text).join(''), parts });

      // 背景は歌詞とは別の時計で回す（M8-2）。本編では音の再生位置が時計だが、
      // このページには音が無い。行を出す前から背景だけを眺められる方が、
      // 「文字が乗っていない状態でどれだけ引けているか」を見るのに都合がよい。
      //
      // 音の代わりに window.loud（0〜1）で盛り上がりを手で動かす。
      // 1 にすると中心の光が広がり、粒が濃くなる
      window.loud = 0;
      const backdrop = new GrainField(
        new ScaledCanvas(document.getElementById('backdrop'), systemPixelRatio),
        neverReduceMotion,
        () => window.loud,
      );
      const spin = (now) => {
        backdrop.render(now / 1000);
        requestAnimationFrame(spin);
      };
      requestAnimationFrame(spin);

      // コマ送りで見たいときは window.hold = true で時計を止め、stage.render(秒) で
      // 任意のコマに飛ぶ。gsap 本体も出しておく（globalTimeline の様子を見る用）
      window.stage = stage;
      window.gsap = gsap;

      console.info(
        [
          `play('文字', '演出名', 構図) / playParts([{ text, at, effect, place, decor, sub }, ...]) で試せます。`,
          `演出名: ${Object.keys(effects).join(' / ')}`,
          `at: ${Object.keys(ANCHOR_CLASS).join(' / ')}`,
          `size: ${Object.keys(SIZE_CLASS).join(' / ')}`,
          `decor（語句に貼り付く図形。playParts でのみ指定）: ${Object.keys(decors).join(' / ')}`,
          `sub（語句に添える英字。playParts でのみ指定。例 sub: 'LIKE MAGIC'）`,
          `背景の盛り上がりは window.loud = 0〜1 で動かせます。`,
        ].join('\n'),
      );
    </script>
  </body>
</html>
