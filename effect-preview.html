<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>演出プレビュー（開発用）</title>
  </head>
  <body>
    <!--
      演出だけを音源抜きで見比べるための開発用ページ。`npm run dev` で
      /lyric-stage/effect-preview.html を開き、コンソールから play('文字', 'bounce') と叩く。
      （vite.config.ts の base が /lyric-stage/ なので、dev サーバーでもこの前置きが要る）

      Vite のビルド入口は index.html だけなので、このページは dist に入らない
      （＝公開サイトには出ない）。曲の再生位置に縛られず新しい演出を確かめられるので、
      M4 以降で演出を足すときはここで見る。

      注意:
      - tsconfig の include は src だけなので、このページの中身は型検査もテストも通らない。
        LyricStage のシグネチャを変えたら、ここも手で直す必要がある
      - vite.config.ts で複数ページ構成（rollupOptions.input）にすると公開対象に入る。
        その時はこのページを除外すること
    -->
    <main class="stage">
      <div class="stage__text" id="stage-text"></div>
    </main>
    <script type="module">
      import gsap from 'gsap';
      import { SplitText } from 'gsap/SplitText';
      import { effects } from './src/stage/effects.ts';
      import { LyricStage } from './src/stage/lyric-stage.ts';
      import './src/style.css';

      gsap.registerPlugin(SplitText);

      const stage = new LyricStage(document.getElementById('stage-text'));

      /** 1 行を指定の演出で表示する。effect を省くと既定の演出になる */
      window.play = (text, effect) => stage.show({ time: 0, text, effect });

      // 演出は一瞬で終わるので、コマ送りで見たいときのために gsap を出しておく。
      // gsap.globalTimeline.pause() で全体を止め、.time(秒) で任意のコマに飛べる
      window.gsap = gsap;

      console.info(`play('文字', '演出名') で試せます。演出名: ${Object.keys(effects).join(' / ')}`);
    </script>
  </body>
</html>
