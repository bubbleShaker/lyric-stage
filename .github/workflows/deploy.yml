name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定は読み取りのみ。npm ci / npm run build を動かす build ジョブに Pages への
# 書き込み権限を持たせない（依存パッケージが汚染されても公開サイトを書き換えられない）。
permissions:
  contents: read

# 同時実行を 1 本に絞る。デプロイ中のキャンセルは公開物が中途半端になるため false。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages への書き込みと OIDC はデプロイジョブだけに限定する
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
